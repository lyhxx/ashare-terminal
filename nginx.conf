# A股情绪轮动终端 —— Nginx 反向代理配置（样例）
# 作用：把域名 80/443 反代到容器内的 8000，并提供 HTTPS。
# 用法（宿主机已装 nginx）：
#   1) 把本文件放到 /etc/nginx/conf.d/ashare-terminal.conf
#   2) 申请证书：certbot --nginx -d your.domain.com
#   3) 把 docker-compose.yml 里 web.ports 注释掉（仅容器内暴露），
#      或将下面 proxy_pass 指向 http://127.0.0.1:8000
#   4) nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your.domain.com;   # 改成你的域名

    # 证书申请期间保留，certbot 会自动改写 443 段
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your.domain.com;   # 改成你的域名

    # certbot 申请的证书（路径按实际调整）
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 反代到后端（容器暴露的 8000；若宿主直接跑 gunicorn 则 127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源可加缓存
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 1d;
        add_header Cache-Control "public";
    }
}
